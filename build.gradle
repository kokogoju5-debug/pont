plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = project.mod_version
group = 'net.kroia.stockmarketbridge'

base {
    archivesName = 'stockmarketbridge-' + project.minecraft_version
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
        }
        client {
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', project.mod_id
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Les jars des mods dépendants sont à déposer dans libs/ (voir libs/README.md)
    flatDir { dir 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("libs:stockmarket:${stockmarket_version}")
    implementation fg.deobf("libs:banksystem:${banksystem_version}")
    implementation fg.deobf("libs:modutilities:${modutilities_version}")
    implementation fg.deobf("libs:architectury:${architectury_version}")
    implementation fg.deobf("libs:cc-tweaked:${cctweaked_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: project.minecraft_version,
        mod_id           : project.mod_id,
        mod_version      : project.mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
